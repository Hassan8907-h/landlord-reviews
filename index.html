<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Review | Property Maintenance</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.85);
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --error-color: #ef4444;
            --success-color: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(249, 115, 22, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px 16px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .hero-image {
            width: 100%;
            height: 140px;
            object-fit: cover;
            display: block;
            border-bottom: 1px solid var(--border-color);
        }

        .header-content {
            padding: 24px;
        }

        .tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #f97316;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tag::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #f97316;
            border-radius: 50%;
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        p.subtitle {
            margin: 0;
            font-size: 0.92rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .form-card {
            padding: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        select, textarea, input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s ease;
        }

        select:focus, textarea:focus, input[type="text"]:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:active {
            transform: scale(0.99);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-message {
            display: none;
            padding: 16px;
            border-radius: 10px;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .status-message.error {
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--error-color);
            color: #fca5a5;
        }

        .status-message.success {
            background-color: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--success-color);
            color: #6ee7b7;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header Card with Image -->
        <div class="card">
            <!-- Replace image URL with your own asset if desired -->
            <img src="https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=800&q=80" alt="Maintenance" class="hero-image">
            <div class="header-content">
                <div class="tag">Property Maintenance</div>
                <h1>Vendor Review</h1>
                <p class="subtitle">Confirm the suggested vendor, arrange an alternative, or request additional time for review.</p>
            </div>
        </div>

        <!-- Form Card -->
        <div class="card form-card">
            <form id="vendorForm">
                <div class="form-group">
                    <label for="action">Decision / Action</label>
                    <select id="action" name="action" required>
                        <option value="Approved">Approve Suggested Vendor</option>
                        <option value="Alternative">Arrange Alternative Vendor</option>
                        <option value="More Time Needed">Request More Time</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="comments">Comments / Instructions</label>
                    <textarea id="comments" name="comments" placeholder="Add any specific instructions or notes..."></textarea>
                </div>

                <button type="submit" id="submitBtn">Submit Decision</button>
            </form>

            <div id="statusMessage" class="status-message"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('vendorForm');
            const submitBtn = document.getElementById('submitBtn');
            const statusMessage = document.getElementById('statusMessage');

            const urlParams = new URLSearchParams(window.location.search);
            let rawResumeUrl = urlParams.get('resumeUrl');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                if (!rawResumeUrl) {
                    showStatus('error', 'Missing workflow link. Please access this page using the exact URL provided in your email.');
                    return;
                }

                // Decode percent-encoded characters
                let decodedUrl = decodeURIComponent(rawResumeUrl);
                if (decodedUrl.includes('%3A') || decodedUrl.includes('%2F')) {
                    decodedUrl = decodeURIComponent(decodedUrl);
                }

                submitBtn.disabled = true;
                submitBtn.innerText = 'Submitting...';

                const formData = {
                    action: document.getElementById('action').value,
                    comments: document.getElementById('comments').value,
                    submittedAt: new Date().toISOString()
                };

                try {
                    const response = await fetch(decodedUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(formData)
                    });

                    if (response.ok) {
                        form.style.display = 'none';
                        showStatus('success', '<strong>Thank you!</strong> Your decision has been successfully recorded.');
                    } else {
                        throw new Error(`Server returned status ${response.status}`);
                    }
                } catch (error) {
                    console.error('Submission Error:', error);
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Submit Decision';
                    showStatus('error', '<strong>Couldn\'t submit your response</strong><br>There was a problem reaching the workflow. Please check your connection or try again.');
                }
            });

            function showStatus(type, message) {
                statusMessage.className = `status-message ${type}`;
                statusMessage.innerHTML = message;
                statusMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
