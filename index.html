<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Review | Property Maintenance</title>
    <style>
        :root {
            --bg-color: #1a1a1e;
            --card-bg: #2b2b36;
            --accent-color: #3b82f6;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --grid-color: rgba(255, 255, 255, 0.05);
            --error-color: #ef4444;
            --success-color: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            /* Box / Grid Pattern Background */
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 32px 32px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Top Hero Image Header */
        .card-image {
            width: calc(100% + 48px);
            height: 160px;
            object-fit: cover;
            margin: -24px -24px 20px -24px;
            display: block;
        }

        .tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #f97316;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tag::before {
            content: "";
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #f97316;
            border-radius: 50%;
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 1.5rem;
            font-weight: 700;
        }

        p.subtitle {
            margin: 0;
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        select, textarea, input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-message {
            display: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .status-message.error {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error-color);
            color: #fca5a5;
        }

        .status-message.success {
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success-color);
            color: #6ee7b7;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header Card -->
        <div class="card">
            <!-- Background / Header Image -->
            <img src="https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=800&q=80" alt="Vendor Banner" class="card-image">
            <div class="tag">Property Maintenance</div>
            <h1>Vendor Review</h1>
            <p class="subtitle">Confirm the suggested vendor, arrange an alternative, or ask for more time.</p>
        </div>

        <!-- Form Card -->
        <div class="card">
            <form id="vendorForm">
                <div class="form-group">
                    <label for="action">Decision / Action</label>
                    <select id="action" name="action" required>
                        <option value="Approved">Approve Suggested Vendor</option>
                        <option value="Alternative">Arrange Alternative Vendor</option>
                        <option value="More Time Needed">Request More Time</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="comments">Comments / Instructions</label>
                    <textarea id="comments" name="comments" placeholder="Add any details or instructions here..."></textarea>
                </div>

                <button type="submit" id="submitBtn">Submit Decision</button>
            </form>

            <div id="statusMessage" class="status-message"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('vendorForm');
            const submitBtn = document.getElementById('submitBtn');
            const statusMessage = document.getElementById('statusMessage');

            // 1. Get raw parameter
            const urlParams = new URLSearchParams(window.location.search);
            let rawResumeUrl = urlParams.get('resumeUrl');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                if (!rawResumeUrl) {
                    showStatus('error', 'Missing workflow link. Please access this page using the exact URL provided in your email.');
                    return;
                }

                // 2. Decode %3A%2F%2F -> ://
                let decodedUrl = decodeURIComponent(rawResumeUrl);
                if (decodedUrl.includes('%3A') || decodedUrl.includes('%2F')) {
                    decodedUrl = decodeURIComponent(decodedUrl);
                }

                submitBtn.disabled = true;
                submitBtn.innerText = 'Submitting...';

                const formData = {
                    action: document.getElementById('action').value,
                    comments: document.getElementById('comments').value,
                    submittedAt: new Date().toISOString()
                };

                try {
                    // 3. Post to n8n webhook/wait node
                    const response = await fetch(decodedUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(formData)
                    });

                    if (response.ok) {
                        form.style.display = 'none';
                        showStatus('success', '<strong>Thank you!</strong> Your decision has been successfully recorded.');
                    } else {
                        throw new Error(`Server returned status ${response.status}`);
                    }
                } catch (error) {
                    console.error('Submission Error:', error);
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Submit Decision';
                    showStatus('error', '<strong>Couldn\'t submit your response</strong><br>There was a problem reaching the workflow. Please try the link again, or contact the office directly.');
                }
            });

            function showStatus(type, message) {
                statusMessage.className = `status-message ${type}`;
                statusMessage.innerHTML = message;
                statusMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
